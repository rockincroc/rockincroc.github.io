{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a class="site-nav__brand" href="{{ base_path }}/" aria-label="{{ site.title }} home">{{ site.title }}</a>
      <ul class="site-nav__links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li{% if page.url == link.url %} class="is-active"{% endif %}><a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>
